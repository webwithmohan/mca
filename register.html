<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
 <style>
    *{
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
    }
    body{
        font-family: Arial, Helvetica, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
    }
    section{
        display: flex;
        flex-direction: column;
        width: 500px;
       
        gap: 20px;
        justify-content: center;
    }
    a{
       
        width: 100%;
        border: 1px solid rgb(43, 179, 241);
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 10px;
        text-decoration: none;
        color: rgb(43, 179, 241);
        font-weight: bold;
    }
    a:hover{
        background-color: rgb(238, 237, 237);
    }
    
    .input-group input{
        width: 100%;
        height: 60px;
        border: none;
        outline: none;
        padding: 0px 10px;
        margin: 3px 0px;
        border-radius: 15px;
        border: 1px solid rgb(212, 211, 211);
        font-size: 15px;
        
    }
    .input-group input:focus{
        border: 1px solid black;
    }
    .btn-group button{
        width: 100%;
         height: 40px;
        border: none;
        outline: none;
        padding: 0px 5px;
        margin: 3px 0px;
    }
     .btn-group .login-btn{
        background-color: rgb(43, 179, 241);
        color: white;
        border-radius: 10px;
     }
     .btn-group .forgot-btn{
       
         color:rgb(17, 1, 1);
        border-radius: 10px;
        background-color: white;
        font-weight: bold;
       
        

     } 
     .btn-group .forgot-btn:hover{
        background-color: rgb(240, 238, 238);
     }
     .fa-facebook{
        color: rgb(61, 122, 236);
     }
        .fa-github{
        color: rgb(8, 9, 10);
     }
        .fa-instagram{
        color: rgb(218, 9, 190);
     }
     .or{
        display: flex;
        justify-content: center;
        align-items: center;
     }
     .social-icons{
        display: flex;
        justify-content: center;
     }
     .social-icons .icons{
        font-size: 40px;
        margin: 0px 20px;

     }
     @media screen and (max-width:576px){
        body{
            min-height: 100vh;
        }
        section{
            width: 400px;
        }
     }
     

     

 
 </style>
</head>
<body>
    <section>
        <h3>Create New Account</h3>
        <div class="input-group">
            <input type="text" placeholder="User Name" required>
            <input type="email" placeholder="Enter Email Address" required>
            <input type="text" name="" id="" placeholder="Phone" required>
           <input type="text" placeholder="Address">
           <input type="password" placeholder="Password">
           <input type="password" placeholder="Confirm Password">

           
        </div>
        <div class="btn-group">
            <button class="login-btn">Submit</button>
            <button class="forgot-btn" id="forgot-btn">I already hava an account</button>
        </div>
        

    </section>
   

  

     <script src="script.js"></script>       
</body>
</html>
